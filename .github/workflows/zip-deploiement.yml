#
# Construit tracteur_deploiement.zip (tools/empaqueter.php) et le joint à la release.
#  - automatiquement quand une release est publiée (à partir de la version qui contient ce fichier) ;
#  - à la demande : onglet « Actions », « Zip de déploiement », « Run workflow », en indiquant l'étiquette
#    d'une release existante (par exemple v1.0.3) pour lui joindre son zip.
name: Zip de déploiement

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      etiquette:
        description: "Étiquette de la release à laquelle joindre le zip (par exemple v1.0.3)"
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.etiquette || github.ref }}

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: zip

      - name: Construire le zip
        run: php tools/empaqueter.php dist/tracteur_deploiement.zip

      - name: Joindre le zip à la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ETIQUETTE: ${{ github.event.inputs.etiquette || github.event.release.tag_name }}
        run: gh release upload "$ETIQUETTE" dist/tracteur_deploiement.zip --clobber --repo "$GITHUB_REPOSITORY"
